# `docker compose up` → the full two-party demo: **four containers, zero
# databases**.
#
# Org A (the shipper) and Org B (the weigher), each with its own connector and
# its own process UI. Every container is an application process; nothing here is
# a database, a queue or a broker, which is the claim the count is making.
#
# The two UIs are deliberately dispensable. `docker compose stop org-a-ui` and the
# process carries on — peers keep delivering, subscriptions keep firing, and the
# other side notices nothing. That is the whole point of the split, and it is
# worth doing once in front of an audience.
#
# Before the first run:
#
#     pnpm demo:env      # writes a gitignored .env with fresh credentials
#
# Every secret in this file is a variable *name*. The values live in `.env`,
# which compose reads automatically and git ignores, so nothing here can be
# committed by accident. Remotely the same variables come from a secret manager.
#
# For the headless profile, run only the two connectors:
#
#     docker compose up org-a org-b
#
# For the automated party — Org B driven by a backoffice instead of a person —
# add the overlay, which brings a fifth container and the subscription that feeds
# it:
#
#     docker compose -f docker-compose.yml -f docker-compose.automated.yml up
#
# Note what is seeded and what is not. `PILOTS_CONNECTIONS` establishes the
# connection at boot so that `up` reaches a first transaction in under a minute.
# The handshake still works without it, and S0 in the test suite is what proves
# that; seeding is a shortcut, never a replacement.
services:
  org-a:
    build:
      context: .
      dockerfile: apps/connector/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PILOTS_PARTICIPANT_ID: org-a
      PILOTS_PARTICIPANT_DID: did:web:org-a.example
      # The name people see. `org-a` is the identity; this is the label, and the
      # two are separate on purpose — a demo for a particular audience sets
      # ORG_A_NAME in `.env` and nothing else changes.
      PILOTS_PARTICIPANT_NAME: ${ORG_A_NAME:-Org A}
      PILOTS_BASE_URL: http://org-a:3000
      PILOTS_LOG_LEVEL: info
      # This demo *is* development, and has to say so. The image defaults to
      # NODE_ENV=production, and the connector refuses to start with
      # PILOTS_DEV_DID_DIRECTORY under it — which is the point of that guard.
      NODE_ENV: development
      # Org A dials out and holds the line: `stream` inbound. It needs no route
      # in, no DNS entry and no certificate — the profile a one-truck haulier
      # runs. Org B is delivered to the same way for symmetry.
      PILOTS_CONNECTIONS: >-
        [{"participantId":"org-a",
          "peerDid":"did:web:org-b.example",
          "peerBaseUrl":"http://org-b:3000",
          "displayName":"Org B",
          "inbound":{"channel":"stream"},
          "outbound":{"channel":"stream"}}]
      # Development only, and the connector refuses it under NODE_ENV=production.
      # The demo's DIDs do not resolve over DNS, so peer identity is resolved
      # through the configured base URL instead — which reduces the
      # domain-binding check to "an operator configured this". See
      # docs/ARCHITECTURE.md §8.
      PILOTS_DEV_DID_DIRECTORY: 'true'
      # The key this participant's UI will present. **A name, never a value** —
      # it comes from `.env`, which `pnpm demo:env` generates and .gitignore
      # excludes. Remotely the same variable comes from a secret manager, and the
      # connector refuses this setting under NODE_ENV=production anyway.
      PILOTS_SEED_API_KEY: ${ORG_A_API_KEY:?run `pnpm demo:env` first}
      # The admin token an operator would otherwise read once from this
      # container's log. Safe to fix here because `/api/admin/v1` is never
      # meant to be reachable from outside this Docker network — see
      # docs/ARCHITECTURE.md §4 — and refused under NODE_ENV=production anyway.
      PILOTS_SEED_ADMIN_TOKEN: ${ORG_A_ADMIN_TOKEN:?run `pnpm demo:env` first}
      # The signing key and the API-key pepper are generated on first boot into
      # the volume below. Neither appears here.
    volumes:
      - org-a-data:/data
    # The claim, enforced rather than asserted: if a connector stops fitting in a
    # 1 GB container, `docker compose up` fails instead of the number quietly
    # going stale in a document.
    mem_limit: 1g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/.well-known/did.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  org-b:
    build:
      context: .
      dockerfile: apps/connector/Dockerfile
    ports:
      - '3001:3000'
    environment:
      PILOTS_PARTICIPANT_ID: org-b
      PILOTS_PARTICIPANT_DID: did:web:org-b.example
      PILOTS_PARTICIPANT_NAME: ${ORG_B_NAME:-Org B}
      PILOTS_BASE_URL: http://org-b:3000
      PILOTS_LOG_LEVEL: info
      NODE_ENV: development
      PILOTS_CONNECTIONS: >-
        [{"participantId":"org-b",
          "peerDid":"did:web:org-a.example",
          "peerBaseUrl":"http://org-a:3000",
          "displayName":"Org A",
          "inbound":{"channel":"stream"},
          "outbound":{"channel":"stream"}}]
      PILOTS_DEV_DID_DIRECTORY: 'true'
      PILOTS_SEED_API_KEY: ${ORG_B_API_KEY:?run `pnpm demo:env` first}
      PILOTS_SEED_ADMIN_TOKEN: ${ORG_B_ADMIN_TOKEN:?run `pnpm demo:env` first}
    volumes:
      - org-b-data:/data
    mem_limit: 1g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/.well-known/did.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── the process UIs ────────────────────────────────────────────────────────
  #
  # Each holds one API key, scoped to one participant, and owns its own user
  # accounts. The connector authenticates the key and records who was driving as
  # an audit hint — it has no idea who these users are, and that is exactly what
  # lets somebody replace this UI with their own.

  org-a-ui:
    build:
      context: .
      dockerfile: apps/process-ui/Dockerfile
    ports:
      - '4000:4000'
    depends_on:
      org-a:
        condition: service_healthy
    environment:
      PILOTS_CONNECTOR_URL: http://org-a:3000
      # The same value the connector registered. One key, one participant.
      PILOTS_API_KEY: ${ORG_A_API_KEY:?run `pnpm demo:env` first}
      PILOTS_UI_AUTH_SECRET: ${ORG_A_UI_AUTH_SECRET:?run `pnpm demo:env` first}
      # The same label as its connector's, so the two screens in a side-by-side
      # demo are never ambiguous about which organisation they belong to.
      PILOTS_UI_NAME: ${ORG_A_NAME:-Org A}
      # Cookies ignore the port, so both UIs on localhost would otherwise share
      # one session cookie and sign each other out. Two process UIs on one host
      # must differ here.
      PILOTS_UI_COOKIE_PREFIX: org-a
      # Demo affordances: the "fill with sample data" button on every form.
      # A flag of its own rather than a reading of NODE_ENV — a deployed demo
      # node runs NODE_ENV=production and still wants these.
      PILOTS_UI_DEMO_TOOLS: 'true'
      PILOTS_UI_BASE_URL: http://localhost:4000
      NODE_ENV: development
      # A demo account, so `up` reaches a usable screen. Deliberately readable:
      # it is a login somebody has to type, and hiding it in `.env` would only
      # mean going to look it up. It grants access to nothing but this
      # throwaway UI, and `loadConfig` refuses the whole seeding mechanism under
      # NODE_ENV=production. Override from `.env` if you would rather.
      PILOTS_UI_SEED_EMAIL: ${ORG_A_UI_EMAIL:-alice@org-a.example}
      PILOTS_UI_SEED_PASSWORD: ${ORG_A_UI_PASSWORD:-OrgA_123}
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  org-b-ui:
    build:
      context: .
      dockerfile: apps/process-ui/Dockerfile
    ports:
      - '4001:4000'
    depends_on:
      org-b:
        condition: service_healthy
    environment:
      PILOTS_CONNECTOR_URL: http://org-b:3000
      PILOTS_API_KEY: ${ORG_B_API_KEY:?run `pnpm demo:env` first}
      PILOTS_UI_AUTH_SECRET: ${ORG_B_UI_AUTH_SECRET:?run `pnpm demo:env` first}
      PILOTS_UI_NAME: ${ORG_B_NAME:-Org B}
      PILOTS_UI_COOKIE_PREFIX: org-b
      PILOTS_UI_DEMO_TOOLS: 'true'
      PILOTS_UI_BASE_URL: http://localhost:4001
      NODE_ENV: development
      PILOTS_UI_SEED_EMAIL: ${ORG_B_UI_EMAIL:-bob@org-b.example}
      PILOTS_UI_SEED_PASSWORD: ${ORG_B_UI_PASSWORD:-OrgB_123}
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  org-a-data:
  org-b-data:
