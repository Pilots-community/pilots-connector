# `docker compose up` → the full two-party demo: **four containers, zero
# databases**.
#
# Acme (the shipper) and Van Moer (the weigher), each with its own connector and
# its own process UI. Every container is an application process; nothing here is
# a database, a queue or a broker, which is the claim the count is making.
#
# The two UIs are deliberately dispensable. `docker compose stop acme-ui` and the
# process carries on — peers keep delivering, subscriptions keep firing, and the
# other side notices nothing. That is the whole point of the split, and it is
# worth doing once in front of an audience.
#
# Before the first run:
#
#     pnpm demo:env      # writes a gitignored .env with fresh credentials
#
# Every secret in this file is a variable *name*. The values live in `.env`,
# which compose reads automatically and git ignores, so nothing here can be
# committed by accident. Remotely the same variables come from a secret manager.
#
# For the headless profile, run only the two connectors:
#
#     docker compose up acme vanmoer
#
# Note what is seeded and what is not. `PILOTS_CONNECTIONS` establishes the
# connection at boot so that `up` reaches a first transaction in under a minute.
# The handshake still works without it, and S0 in the test suite is what proves
# that; seeding is a shortcut, never a replacement.
services:
  acme:
    build:
      context: .
      dockerfile: apps/connector/Dockerfile
    ports:
      - '3000:3000'
    environment:
      PILOTS_PARTICIPANT_ID: acme
      PILOTS_PARTICIPANT_DID: did:web:acme-shipping.example
      PILOTS_PARTICIPANT_NAME: Acme Shipping
      PILOTS_BASE_URL: http://acme:3000
      PILOTS_LOG_LEVEL: info
      # This demo *is* development, and has to say so. The image defaults to
      # NODE_ENV=production, and the connector refuses to start with
      # PILOTS_DEV_DID_DIRECTORY under it — which is the point of that guard.
      NODE_ENV: development
      # Acme dials out and holds the line: `stream` inbound. It needs no route
      # in, no DNS entry and no certificate — the profile a one-truck haulier
      # runs. Van Moer is delivered to the same way for symmetry.
      PILOTS_CONNECTIONS: >-
        [{"participantId":"acme",
          "peerDid":"did:web:vanmoer.example",
          "peerBaseUrl":"http://vanmoer:3000",
          "displayName":"Van Moer",
          "inbound":{"channel":"stream"},
          "outbound":{"channel":"stream"}}]
      # Development only, and the connector refuses it under NODE_ENV=production.
      # The demo's DIDs do not resolve over DNS, so peer identity is resolved
      # through the configured base URL instead — which reduces the
      # domain-binding check to "an operator configured this". See
      # docs/ARCHITECTURE.md §8.
      PILOTS_DEV_DID_DIRECTORY: 'true'
      # The key this participant's UI will present. **A name, never a value** —
      # it comes from `.env`, which `pnpm demo:env` generates and .gitignore
      # excludes. Remotely the same variable comes from a secret manager, and the
      # connector refuses this setting under NODE_ENV=production anyway.
      PILOTS_SEED_API_KEY: ${ACME_API_KEY:?run `pnpm demo:env` first}
      # The signing key, the API-key pepper and the admin token are generated on
      # first boot into the volume below. None of them appears here either.
    volumes:
      - acme-data:/data
    # The claim, enforced rather than asserted: if a connector stops fitting in a
    # 1 GB container, `docker compose up` fails instead of the number quietly
    # going stale in a document.
    mem_limit: 1g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/.well-known/did.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  vanmoer:
    build:
      context: .
      dockerfile: apps/connector/Dockerfile
    ports:
      - '3001:3000'
    environment:
      PILOTS_PARTICIPANT_ID: vanmoer
      PILOTS_PARTICIPANT_DID: did:web:vanmoer.example
      PILOTS_PARTICIPANT_NAME: Van Moer
      PILOTS_BASE_URL: http://vanmoer:3000
      PILOTS_LOG_LEVEL: info
      NODE_ENV: development
      PILOTS_CONNECTIONS: >-
        [{"participantId":"vanmoer",
          "peerDid":"did:web:acme-shipping.example",
          "peerBaseUrl":"http://acme:3000",
          "displayName":"Acme Shipping",
          "inbound":{"channel":"stream"},
          "outbound":{"channel":"stream"}}]
      PILOTS_DEV_DID_DIRECTORY: 'true'
      PILOTS_SEED_API_KEY: ${VANMOER_API_KEY:?run `pnpm demo:env` first}
    volumes:
      - vanmoer-data:/data
    mem_limit: 1g
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/.well-known/did.json').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  # ── the process UIs ────────────────────────────────────────────────────────
  #
  # Each holds one API key, scoped to one participant, and owns its own user
  # accounts. The connector authenticates the key and records who was driving as
  # an audit hint — it has no idea who these users are, and that is exactly what
  # lets somebody replace this UI with their own.

  acme-ui:
    build:
      context: .
      dockerfile: apps/process-ui/Dockerfile
    ports:
      - '4000:4000'
    depends_on:
      acme:
        condition: service_healthy
    environment:
      PILOTS_CONNECTOR_URL: http://acme:3000
      # The same value the connector registered. One key, one participant.
      PILOTS_API_KEY: ${ACME_API_KEY:?run `pnpm demo:env` first}
      PILOTS_UI_AUTH_SECRET: ${ACME_UI_AUTH_SECRET:?run `pnpm demo:env` first}
      PILOTS_UI_NAME: Acme Shipping
      PILOTS_UI_BASE_URL: http://localhost:4000
      NODE_ENV: development
      # A demo account, so `up` reaches a usable screen. Deliberately readable:
      # it is a login somebody has to type, and hiding it in `.env` would only
      # mean going to look it up. It grants access to nothing but this
      # throwaway UI, and `loadConfig` refuses the whole seeding mechanism under
      # NODE_ENV=production. Override from `.env` if you would rather.
      PILOTS_UI_SEED_EMAIL: ${ACME_UI_EMAIL:-alice@acme.example}
      PILOTS_UI_SEED_PASSWORD: ${ACME_UI_PASSWORD:-demo-password-acme}
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  vanmoer-ui:
    build:
      context: .
      dockerfile: apps/process-ui/Dockerfile
    ports:
      - '4001:4000'
    depends_on:
      vanmoer:
        condition: service_healthy
    environment:
      PILOTS_CONNECTOR_URL: http://vanmoer:3000
      PILOTS_API_KEY: ${VANMOER_API_KEY:?run `pnpm demo:env` first}
      PILOTS_UI_AUTH_SECRET: ${VANMOER_UI_AUTH_SECRET:?run `pnpm demo:env` first}
      PILOTS_UI_NAME: Van Moer
      PILOTS_UI_BASE_URL: http://localhost:4001
      NODE_ENV: development
      PILOTS_UI_SEED_EMAIL: ${VANMOER_UI_EMAIL:-bram@vanmoer.example}
      PILOTS_UI_SEED_PASSWORD: ${VANMOER_UI_PASSWORD:-demo-password-vanmoer}
    mem_limit: 512m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  acme-data:
  vanmoer-data:
